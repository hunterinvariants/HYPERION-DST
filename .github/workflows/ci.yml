name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The race detector runs in race.yml, so that its result has a name of
      # its own rather than being one green step inside a general workflow.
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go test ./storage/wal -run '^$' -bench BenchmarkEncode -benchmem
      - run: go run ./cmd/promtact-seeds -from 1 -to 1000 -steps 1000
      # The installer is the first thing a stranger runs, and nothing else here
      # would notice if it stopped parsing. -S error keeps this a correctness
      # gate rather than a style opinion.
      - run: bash -n scripts/install.sh
      - run: shellcheck -S error scripts/install.sh

