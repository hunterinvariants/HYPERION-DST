name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1
      - run: go vet ./...
      - run: go test ./storage/wal -run '^$' -bench BenchmarkEncode -benchmem
      - run: go run ./cmd/hyperion-seeds -from 1 -to 1000 -steps 1000

