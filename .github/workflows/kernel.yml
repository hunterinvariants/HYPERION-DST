name: kernel-build

on:
  push:
    paths:
      - "bpf/**"
      - "chaos/**"
      - "cmd/promtact-chaos/**"
      - "storage/uring/**"
      - ".github/workflows/kernel.yml"
  pull_request:

permissions:
  contents: read

jobs:
  linux-kernel-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
      - run: go test ./chaos ./storage/uring
      - run: go build ./cmd/promtact-chaos
      - run: clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I/usr/include/$(gcc -dumpmachine) -c bpf/promtact_chaos.bpf.c -o /tmp/promtact_chaos.bpf.o

