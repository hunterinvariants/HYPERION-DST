name: release

# Fires on a version tag. Nothing is published unless the tagged commit passes
# its own gates first: a release that skipped them would be exactly the kind of
# unbacked claim this repository exists to avoid.
on:
  push:
    tags:
      - "v*"
  # So the published artifact can be re-checked without cutting a release. A
  # dispatch runs the smoke job alone; gate and build are skipped.
  workflow_dispatch:
    inputs:
      version:
        description: "existing release tag to download and run, for example v0.3.6"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go run ./cmd/promtact-seeds -from 1 -to 1000 -steps 1000
      # Blocking here, unlike in the nightly: shipping signed binaries built
      # with a toolchain that has a known reachable vulnerability is the one
      # case where stopping is clearly right.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Only the umbrella binary ships. It reaches every command, and the
      # standalone binaries exist for the recorded gate scripts, which build
      # from source anyway. Commands needing kernel facilities a target cannot
      # reach are simply absent from that build's command list.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="promtact-${version}-${os}-${arch}"
            binary="dist/${name}"
            if [ "$os" = "windows" ]; then binary="${binary}.exe"; fi
            # -X stamps the tag into the binary. Without it a downloaded file
            # cannot say which release it is, and the file name is not
            # evidence: "promtact version" is what a reader can check.
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/hunterinvariants/promtact/internal/cli.version=${version}" \
              -o "$binary" ./cmd/promtact
          done
          ls -l dist

      # Section 4(d) of the license obliges anyone redistributing these
      # binaries to carry the NOTICE. Shipping both alongside them means a
      # downloader has the terms without going back to the repository.
      - name: License terms
        run: cp LICENSE NOTICE dist/

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # The only third-party action in this repository. The module has no Go
      # dependencies, so the SBOM is close to trivial, but a consumer should
      # not have to take that on trust.
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/promtact-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # First-party Sigstore attestation. It signs with the workflow's OIDC
      # identity, so there is no key to store, lose, or leak.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/promtact-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Binaries are the promtact umbrella command. Verify with SHA256SUMS, and with \`gh attestation verify\` against this repository. See docs/API.md for what is contractual at this version."

  # Until now the released darwin and windows binaries were cross-compiled and
  # never started. The source is tested on all three platforms by ci.yml, which
  # is a different claim: it says the code works there, not that the file we
  # handed out does. This downloads the published artifact and runs it.
  smoke:
    needs: build
    # A dispatch skips gate and build, and a skipped dependency would
    # otherwise skip this job too.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-amd64
          # macos-latest is Apple silicon, so the intel build needs an older
          # image. ubuntu-24.04-arm covers the linux arm64 artifact. Between
          # them every file the release publishes gets started once.
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: macos-latest
            asset: darwin-arm64
          - os: macos-13
            asset: darwin-amd64
          - os: windows-latest
            asset: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the published binary and check it against SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          asset="promtact-${version}-${{ matrix.asset }}"
          gh release download "$version" -R "${GITHUB_REPOSITORY}" \
            -p "$asset" -p SHA256SUMS
          # The windows runner's bash has sha256sum and no shasum; macOS has
          # only shasum. Picking whichever exists is the same choice
          # scripts/install.sh already makes, for the same reason.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS --ignore-missing
          else
            shasum -a 256 -c SHA256SUMS --ignore-missing
          fi

      - name: Run it, and require it to name this release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          asset="promtact-${version}-${{ matrix.asset }}"
          chmod +x "$asset" || true
          "./$asset" version
          # A binary that runs but reports the wrong release would pass a plain
          # smoke test, and that is the one thing this artifact exists to answer.
          "./$asset" version | grep -qx "promtact ${version}"
          "./$asset" help | grep -q "run \"promtact <command> -h\""
